<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Property Admin Panel</title>
</head>

<body>

    <h1>Add New Property</h1>

    <input type="text" id="title" placeholder="Property Title"><br><br>
    <input type="file" id="image"><br><br>
    <input type="text" id="address" placeholder="Property Address"><br><br>
    <input type="text" id="price" placeholder="Property Price"><br><br>

    <textarea id="description" placeholder="Property Description"></textarea><br><br>

    <button type="button" onclick="saveProperty()">Save Property</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://sqavlyzqaxutbwqdytic.supabase.co';
        const supabaseKey = 'sb_publishable_j3AU3mvrWfDYqvxCZ46Z_A_lUEC2PkC';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function saveProperty() {
            try {
                const title = document.getElementById('title').value;
                const imageFile = document.getElementById('image').files[0];

                if (!imageFile) {
                    alert("please select image");
                    return;
                }

                const fileName = Date.now() + "-" + imageFile.name;

                const { error: uploadError } = await supabaseClient.storage
                    .from("Property-images")
                    .upload(fileName, imageFile);

                if (uploadError) {
                    alert("Upload Error = " + uploadError.message);
                    return;
                }

                const { data: urlData, error: urlError } = supabaseClient.storage
                    .from("Property-images")
                    .getPublicUrl(fileName);

                if (urlError) {
                    alert("URL Error = " + urlError.message);
                    return;
                }

                const imageUrl = urlData.publicUrl;

                const { data, error } = await supabaseClient
                    .from('properties')
                    .insert([{
                        title,
                        image: imageUrl,
                        address: document.getElementById('address').value,
                        price: document.getElementById('price').value,
                        description: document.getElementById('description').value
                    }])
                    .select();

                if (error) {
                    alert("Error = " + error.message);
                } else {
                    alert("property inserted successfully");
                }
            } catch (err) {
                alert("ERROR: " + err.message);
            }
        }
    </script>

</body>

</html>
