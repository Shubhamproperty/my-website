<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Property Admin Panel</title>

    <link rel="stylesheet" href="admin.css">


</head>

<body>

    <h1>Add your Property with us </h1>

    <input type="text" id="title" placeholder="Property Details"><br><br>

    <input type="file" id="image" multiple><br><br>



    <input type="text" id="price" placeholder="Property Price"><br><br>

    <input type="text" id="contact_number" placeholder="Contact Number"><br><br>

    <input type="text" id="map_url" placeholder="Google Map Link"><br><br>

    <textarea id="description" placeholder="Property Description"></textarea><br><br>

    <button type="button" onclick="getLocation()">
        Get Current Location
    </button>

    <button type="button" onclick="saveProperty()">
        Save Property
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        alert("SCRIPT LOADED");
        const supabaseUrl =
            "https://sqavlyzqaxutbwqdytic.supabase.co";

        const supabaseKey =
            "sb_publishable_j3AU3mvrWfDYqvxCZ46Z_A_lUEC2PkC";

        const SUPABASE_BUCKET =
            "property- images";

        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        function getLocation() {

            navigator.geolocation.getCurrentPosition(

                function (position) {

                    const lat =
                        position.coords.latitude;

                    const lng =
                        position.coords.longitude;

                    const mapUrl =
                        `https://www.google.com/maps?q=${lat},${lng}`;

                    const mapInput =

                        document.getElementById("map_url")

                    if (mapInput) {

                        mapInput.value =
                            mapUrl;
                    }

                    alert("Location Added Successfully");

                },

                function (error) {

                    alert("Unable to get location");

                }

            );

        }

        async function saveProperty() {

            try {


                const contactNumber =
                    document.getElementById("contact_number").value.trim();

                const title =
                    document.getElementById("title").value.trim();

                const address =
                    document.getElementById("address").value.trim();

                const price =
                    document.getElementById("price").value.trim();

                const description =
                    document.getElementById("description").value.trim();

                const mapUrl =
                    document.getElementById("map_url").value.trim();

                if (
                    !title ||
                    !address ||
                    !price ||
                    !description
                ) {
                    alert("Please fill all fields");
                    return;
                }

                const imageFiles =
                    document.getElementById("image").files;

                alert(imageFiles.length);

                if (imageFiles.length === 0) {
                    alert("Please select photos");
                    return;
                }

                const imageUrls = [];

                console.log("FILES COUNT =",
                    imageFiles.length);

                for (const imageFile of imageFiles) {


                    console.log("UPLOADING =",
                        imageFile.name);

                    const safeName =
                        imageFile.name.replace(/\s+/g, "-");

                    const fileName =
                        `${Date.now()}-${safeName}`;

                    const { error: uploadError } =
                        await supabaseClient.storage
                            .from(SUPABASE_BUCKET)
                            .upload(fileName, imageFile);

                    if (uploadError) {

                        alert(
                            "Upload Error: " +
                            uploadError.message
                        );

                        return;
                    }

                    const { data: urlData } =
                        supabaseClient.storage
                            .from(SUPABASE_BUCKET)
                            .getPublicUrl(fileName);

                    imageUrls.push(
                        urlData.publicUrl
                    );
                }

                alert("TOTAL URLS = " +
                    imageUrls.length);

                alert(JSON.stringify(imageUrls));

                const { error } =
                    await supabaseClient
                        .from("properties")
                        .insert([
                            {
                                contact_number: contactNumber,
                                title,
                                image_urls:
                                    JSON.stringify(imageUrls),
                                address,
                                price,
                                description,
                                map_url: mapUrl
                            }
                        ]);

                if (error) {
                    alert(error.message);
                    return;
                }

                alert("Property Saved Successfully");

            }

            catch (err) {

                console.error(err);

                alert(
                    "Error: " +
                    err.message
                );

            }

        }

    </script>
