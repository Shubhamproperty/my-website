<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Property Admin Panel</title>

    <link rel="stylesheet" href="admin.css?v=20260809">


</head>

<body>

    <h1>Add your Property with us </h1>

    <input type="text" id="Property Details" placeholder="Property Details"><br><br>

    <input type="file" id="image" multiple><br><br>


    <input type="text" id="address" placeholder="Propety Address"> <br><br>

    <input type="text" id="price" placeholder="Property Price"><br><br>

    <input type="text" id="contact_number" placeholder="Contact Number"><br><br>

    <input type="text" id="map_url" placeholder=" Paste your Google Map Link Here"><br><br>


    <textarea id="description" placeholder="Property Description"></textarea><br><br>

    <button type="button" onclick="openGoogleMaps()">
        Open Google Maps
    </button>

    <button type="button" onclick="saveProperty()">
        Save Property
    </button>


    <hr>
    <h2>pending-property</h2>
    <div id="pending-properties"> Loading...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        alert("SCRIPT LOADED");
        const supabaseUrl =
            "https://sqavlyzqaxutbwqdytic.supabase.co";

        const supabaseKey =
            "sb_publishable_j3AU3mvrWfDYqvxCZ46Z_A_lUEC2PkC";

        const SUPABASE_BUCKET =
            "property- images";

        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        function openGoogleMaps() {

            window.open("https://www.google.com/maps", "_blank");
        }







        async function saveProperty() {

            try {


                const contactNumber =
                    document.getElementById("contact_number").value.trim();

                const title =
                    document.getElementById("Property Details").value.trim();

                const address =
                    document.getElementById("address").value.trim();

                const price =
                    document.getElementById("price").value.trim();

                const description =
                    document.getElementById("description").value.trim();

                const mapUrl =
                    document.getElementById("map_url").value.trim();

                if (
                    !title ||
                    !address ||
                    !price ||
                    !description
                ) {
                    alert("Please fill all fields");
                    return;
                }

                const imageFiles =
                    document.getElementById("image").files;

                alert(imageFiles.length);

                if (imageFiles.length === 0) {
                    alert("Please select photos");
                    return;
                }

                const imageUrls = [];

                console.log("FILES COUNT =",
                    imageFiles.length);

                for (const imageFile of imageFiles) {


                    console.log("UPLOADING =",
                        imageFile.name);

                    const safeName =
                        imageFile.name.replace(/\s+/g, "-");

                    const fileName =
                        `${Date.now()}-${safeName}`;

                    const { error: uploadError } =
                        await supabaseClient.storage
                            .from(SUPABASE_BUCKET)
                            .upload(fileName, imageFile);

                    if (uploadError) {

                        alert(
                            "Upload Error: " +
                            uploadError.message
                        );

                        return;
                    }

                    const { data: urlData } =
                        supabaseClient.storage
                            .from(SUPABASE_BUCKET)
                            .getPublicUrl(fileName);

                    imageUrls.push(
                        urlData.publicUrl
                    );
                }

                alert("TOTAL URLS = " +
                    imageUrls.length);

                alert(JSON.stringify(imageUrls));

                const { error } =
                    await supabaseClient
                        .from("properties")
                        .insert([
                            {
                                contact_number: contactNumber,
                                title,
                                image_urls:
                                    JSON.stringify(imageUrls),
                                address,
                                price,
                                description,
                                map_url: mapUrl
                            }
                        ]);

                if (error) {
                    alert(error.message);
                    return;
                }

                alert("Property Saved Successfully");

            }

            catch (err) {

                console.error(err);

                alert(
                    "Error: " +
                    err.message
                );


            }
        }





        async function loadPendingProperties() {

            const { data, error } = await supabaseClient
                .from("properties")
                .select("*")
                .eq("status", "pending");

            const container =
                document.getElementById("pending-properties");

            if (error) {
                container.innerHTML =
                    "Error: " + error.message;
                return;
            }

            container.innerHTML = "";

            data.forEach(property => {

                container.innerHTML += `
        <div style="border:1px solid #ccc;padding:10px;margin:10px 0;">

        <img
        src="${property.image_urls}"width="200">
            


            <h3>${property.title}</h3>

            <p>Price: ${property.price}</p>

            <p>Mobile: ${property.agent_mobile}</p>

            <button onclick="approveProperty(${property.id})">
                Approve
            </button>
        </div>
        `;
            });
        }


        async function approveProperty(propertyId) {

            alert("Approve clicked: " + propertyId);

            const { error } = await supabaseClient
                .from("properties")
                .update({
                    status: "approved"
                })
                .eq("id", propertyId);

            if (error) {

                alert(
                    "Error: " +
                    error.message
                );

                return;
            }

            alert("Property Approved");

            loadPendingProperties();
        }


        loadPendingProperties();



    </script>
</body>
