<!DOCTYPE html>
<html>

<head>

    <title>Share your prpperty</title>


    <style>
        /* Submit Property Page */

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        form,
        .submit-container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:first-of-type {
            background: #0d6efd;
            color: white;
        }

        button:first-of-type:hover {
            background: #0b5ed7;
        }

        button:last-of-type {
            background: #198754;
            color: white;
        }

        button:last-of-type:hover {
            background: #157347;
        }

        /* Mobile */
        @media(max-width:600px) {

            body {
                padding: 10px;
            }

            h2 {
                font-size: 24px;
            }

            input[type="text"],
            input[type="file"] {
                font-size: 16px;
            }

            button {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>






</head>

<body>

    <h2>
        share your proprty
    </h2>



    <input type="file" id="image" multiple><br><br>
    <input type="text" id="price" placeholder="Price"><br><br>

    <input type="text" id="title" placeholder="Property Title"><br><br>
    <input type="text" id="agent_mobile" placeholder="mobile number"><br><br>
    <input type="text" id="map_url" placeholder=" Paste your location Here"><br><br>

    <button type="button" onclick="submitProperty()">Submit Property</button>
    <button type="button" onclick="opengooglemap()">Open map</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl =
            "https://sqavlyzqaxutbwqdytic.supabase.co";

        const supabaseKey =
            "sb_publishable_j3AU3mvrWfDYqvxCZ46Z_A_lUEC2PkC";

        const SUPABASE_BUCKET =
            "property- images";

        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        function opengooglemap() {
            window.open("https://www.google.com/maps", "_blank");
        }











        const sb =
            window.supabase.createClient(
                "https://sqavlyzqaxutbwqdytic.supabase.co",
                "sb_publishable_j3AU3mvrWfDYqvxCZ46Z_A_lUEC2PkC"
            );
        async function submitProperty() {

            const imageFiles = document.getElementById("image").files;

            if (imageFiles.length === 0) {
                alert("Please select at least one image");
                return;
            }

            const title = document.getElementById("title").value;
            const price = document.getElementById("price").value;
            const agent_mobile = document.getElementById("agent_mobile").value;
            const map_url = document.getElementById("map_url").value;

            let imageUrls = [];

            for (let i = 0; i < imageFiles.length; i++) {

                const imageFile = imageFiles[i];

                const fileName =
                    Date.now() + "" + i + "" + imageFile.name;

                const { error: uploadError } =
                    await sb.storage
                        .from("property- images")
                        .upload(fileName, imageFile);

                if (uploadError) {
                    alert("Upload Error: " + uploadError.message);
                    return;
                }

                const { data } =
                    sb.storage
                        .from("property- images")
                        .getPublicUrl(fileName);

                imageUrls.push(data.publicUrl);
            }

            const { error } =
                await sb
                    .from("properties")
                    .insert([
                        {
                            title: title,
                            price: price,
                            agent_mobile: agent_mobile,
                            map_url: map_url,
                            image_urls: JSON.stringify(imageUrls),
                            status: "pending"
                        }
                    ]);

            if (error) {
                alert("Database Error: " + error.message);
            } else {
                alert("Property Submitted Successfully");
                location.reload();
            }
        }
    </script>
</body>

</html>
